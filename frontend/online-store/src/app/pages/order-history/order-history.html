<div class="orders-container">
  <h2>My Orders</h2>
  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Date</th>
        <th>Status</th>
        <th>Total</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
      @for (o of orders; track o.id) {
        <tr>
          <td>{{ o.id }}</td>
          <td>{{ o.date | date }}</td>
          <td>{{ o.status }}</td>
          <td>${{ o.total }}</td>
          <td><a [routerLink]="['/order-confirmation', o.id]">View</a></td>
        </tr>
      }
    </tbody>
  </table>
</div>
