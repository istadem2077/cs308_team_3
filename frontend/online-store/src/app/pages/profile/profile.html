<div class="profile-container">

  <h2>My Profile</h2>

  <!-- Not Logged In -->
  @if (!isLoggedIn) {
    <div class="login-warning">
      <p>You must log in to view your profile.</p>
      <a routerLink="/login" class="btn-primary">Go to Login</a>
    </div>
  }

  <!-- Logged In -->
  @if (isLoggedIn) {
    <div class="profile-card">

      <div class="info-row">
        <span class="label">Name:</span>
        <span class="value">{{ name }}</span>
      </div>

      <div class="info-row">
        <span class="label">Email:</span>
        <span class="value">{{ email }}</span>
      </div>

      <div class="info-row">
        <span class="label">Address:</span>
        <span class="value">{{ address || 'Not set' }}</span>
      </div>

      <div class="actions">
        <a routerLink="/update-address" class="btn-secondary">Update Address</a>
        <a routerLink="/update-password" class="btn-secondary">Change Password</a>
        <a routerLink="/history" class="btn-primary">Order History</a>
        <button (click)="logout()" class="btn-danger">Logout</button>
      </div>

    </div>
  }

</div>
